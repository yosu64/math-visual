 $('boundaryExample').setAttribute('aria-pressed',state.mode==='single'&&t===4);
}
function announce(){const t=tValue();$('a11yStatus').textContent=state.mode==='all'?(state.side==='inside'?'円の内部':'円の外部')+'を表示しています。': '右辺t='+fmt(t)+'、半径'+fmt(Math.sqrt(t))+'。'+(accepted(t)?'条件を満たします。':'条件を満たしません。');}
function pause(){state.running=false;state.previous=null;if(state.raf)cancelAnimationFrame(state.raf);state.raf=0;}
function setT(v,{single=false}={}){
 if(!Number.isFinite(v))return;
 const limit=state.side==='inside'?4:maxT;
 state.tick=Math.round(clamp(v,0,limit)*100);
 if(single||state.mode==='all'){state.mode='single';state.lo=state.hi=state.tick;}
 else if(state.mode==='sweep'){state.lo=Math.min(state.lo,state.tick);state.hi=Math.max(state.hi,state.tick);}
 state.rTravel=Math.sqrt(tValue());render();
}
function showOne(v=tValue()){pause();setT(v,{single:true});announce();}
function showAll(){pause();state.mode='all';state.tick=state.side==='inside'?0:Math.round(maxT*100);render();announce();}
function changeSide(side){pause();state.side=side==='outside'?'outside':'inside';state.mode='single';state.lo=state.hi=400;state.passed.clear();setT(state.side==='inside'?3:5,{single:true});announce();}
function start(){
 if(state.running){pause();render();announce();return;}
 const inside=state.side==='inside';
 if(state.mode!=='sweep'||(inside&&tValue()<=0)||(!inside&&tValue()>=maxT)){
  state.mode='sweep';state.tick=400;state.lo=state.hi=400;state.rTravel=2;state.hold=450;state.passed.clear();
 }else{state.rTravel=currentRadius();state.hold=0;}
 state.running=true;state.previous=null;render();state.raf=requestAnimationFrame(frame);
}
function frame(time){
 if(!state.running)return;
 const dt=state.previous===null?0:Math.min(time-state.previous,80);state.previous=time;
 if(state.hold>0){state.hold=Math.max(0,state.hold-dt);state.raf=requestAnimationFrame(frame);return;}
 const inside=state.side==='inside',direction=inside?-1:1,target=inside?0:Math.sqrt(maxT);
 const speed=inside?2/8500:(Math.sqrt(maxT)-2)/8500;
 let next=clamp(state.rTravel+direction*dt*speed,inside?0:2,inside?2:target);
 const stops=(inside?[3,2,1]:[5,6,9,16,25]).filter(v=>v<maxT);
 for(const v of stops){const rv=Math.sqrt(v);if(!state.passed.has(v)&&(inside?next<=rv&&state.rTravel>=rv:next>=rv&&state.rTravel<=rv)){next=rv;state.hold=450;state.passed.add(v);break;}}
 state.rTravel=next;
 // The same hundredth is used by the equality, radius and accumulated interval.
 const tick=Math.round(next*next*100);
 state.tick=tick;state.lo=Math.min(state.lo,tick);state.hi=Math.max(state.hi,tick);
 if((inside&&next<=0)||(!inside&&next>=target)){showAll();return;}
 render();state.raf=requestAnimationFrame(frame);
}
$('play').addEventListener('click',start);$('single').addEventListener('click',()=>showOne());$('finish').addEventListener('click',showAll);
$('inside').addEventListener('click',()=>changeSide('inside'));$('outside').addEventListener('click',()=>changeSide('outside'));
$('inclusive').addEventListener('change',e=>{pause();state.inclusive=e.target.checked;render();announce();});
$('tSlider').addEventListener('input',e=>{pause();setT(Number(e.target.value));});$('tSlider').addEventListener('change',announce);
for(let i=0;i<4;i++)$('example'+i).addEventListener('click',()=>showOne(Number($('example'+i).dataset.value)));
$('boundaryExample').addEventListener('click',()=>showOne(4));
$('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('a11yStatus').textContent='この表示環境では全画面を利用できません。';}});
document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'全画面を終了':'全画面';});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();render();}});
document.addEventListener('keydown',e=>{if(e.target.isContentEditable||['INPUT','SELECT','BUTTON','TEXTAREA','A'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();start();}else if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();pause();setT(tValue()+(e.key==='ArrowRight'?0.1:-0.1));announce();}});
let dragId=null;
function pointerValue(e){const b=$('diagram').getBoundingClientRect();const x=(e.clientX-b.left)*G.w/b.width,y=(e.clientY-b.top)*G.h/b.height;return ((x-G.cx)/G.s)**2+((y-G.cy)/G.s)**2;}
$('diagram').addEventListener('pointerdown',e=>{if(e.button!==0)return;pause();dragId=e.pointerId;$('diagram').setPointerCapture(dragId);setT(pointerValue(e));});
$('diagram').addEventListener('pointermove',e=>{if(e.pointerId===dragId)setT(pointerValue(e));});
for(const event of ['pointerup','pointercancel','lostpointercapture'])$('diagram').addEventListener(event,e=>{if(e.pointerId===dragId){dragId=null;announce();}});
