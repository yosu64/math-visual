<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>円を描いて、三角比を求めよう | Math Visual</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#163139;font:16px/1.7 system-ui,sans-serif}main,header,footer{width:min(100% - 32px,1080px);margin:auto}header,footer{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-size:14px;border-bottom:1px solid #c5c9bb}a{color:#175d54}h1{font-size:clamp(27px,5vw,54px);letter-spacing:-.06em;line-height:1.2;margin:28px 0 10px}p{margin:8px 0 20px}.studio{display:grid;grid-template-columns:1.15fr 1fr;border-radius:20px;overflow:hidden;border:1px solid #bfcbc0;background:#fffcf4}figure{margin:0;padding:16px;background:radial-gradient(ellipse,#194551,#0d2530);color:#e9f5ed}figcaption{display:flex;justify-content:space-between}svg{width:100%;display:block;max-height:410px}svg text{font:16px Georgia;fill:#f7f2de;paint-order:stroke;stroke:#173641;stroke-width:4px}.notes{padding:clamp(18px,3vw,34px);display:flex;flex-direction:column}h2{font-size:clamp(21px,3vw,30px);line-height:1.4;margin:12px 0 4px}.steps{display:flex;gap:6px}.steps button{flex:1;padding:6px 0;font-size:13px}.steps [aria-current=step],.angles [aria-pressed=true]{background:#175e53;color:white}.controls{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}button,.cta{border:1px solid #9bab9e;border-radius:8px;color:inherit;background:#fffdf7;padding:9px 13px;font:inherit;cursor:pointer}button:disabled{opacity:.45}.cta{display:inline-block;color:white;background:#115c50;text-decoration:none;padding:12px 22px}button:focus-visible,a:focus-visible{outline:3px solid #cd842a;outline-offset:2px}.angles{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 22px}.angles button{min-width:52px}.work{padding:20px 0}.math{font:22px/1.65 Georgia,serif}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;font-size:.85em;line-height:1.12}.frac span:first-child{border-bottom:1px solid}.eq{padding:5px 0;border-bottom:1px solid #d7ded0}footer{margin-top:16px}@media(max-width:720px){.studio{grid-template-columns:1fr}svg{max-height:300px}.notes{min-height:230px}}
math,#reading,.angles button{font-family:"STIX Two Math","Cambria Math","Latin Modern Math",math}
.diagram-label{display:grid;place-items:center;height:100%;color:#fff4da;font-size:17px;text-shadow:0 1px 3px #132c34}
.equations{border-collapse:collapse;width:100%;font-size:clamp(16px,1.55vw,22px)}
.equations tr{border-bottom:1px solid #d7ded0}
.equations td,.equations th{padding:9px 2px;white-space:nowrap;text-align:center}
.equations td math{math-style:normal}
.equations th{font-size:12px;text-align:left;font-weight:500}
@media(max-width:480px),(min-width:721px) and (max-width:950px){.equations th{display:none}.notes{padding-inline:12px}.equations{font-size:16px}}

<header><a href="../index.html">← Math Visual</a><span>数学Ⅱ ／ 三角関数</span></header>
<main><h1>円を描いて、三角比を求めよう</h1><p>0°から360°までの値の表を、丸ごと覚える必要はありません。まずは150°。頭の中で半径を回し、見覚えのある直角三角形を探そう。</p>
<div class="studio"><figure><figcaption><strong>原点 O を中心とする円</strong><span id="reading"></span></figcaption><svg id="board" viewBox="-185 -155 370 310" role="img"></svg></figure>
<section class="notes"><nav class="steps" aria-label="解説の段階"></nav><h2 id="title"></h2><div id="body"></div><div class="controls"><button id="play">▶ 自動再生</button><button id="back">← 戻る</button><button id="next">次へ →</button></div></section></div>
<section class="work"><h2>別の角でも試そう</h2><button id="tour">▶ 0°から360°まで通し再生</button><div class="angles"></div><a class="cta" href="trig-value-time-attack.html">ゲームへ進む　10問に挑戦 →</a></section></main><footer>© 2026 shibasaki / Math Visual</footer>
<script>
const $=id=>document.getElementById(id);
const angles=[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330,360];
const labels=['始線','回転','辺の比','三角比'];
let a=150,step=0,auto=false,tour=false,shown=0,timer,frame;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
// All expressions come from the lesson's fixed angle and ratio vocabulary.
function tokens(expression){
  return String(expression).match(/√[23]|[0-9]+|sin|cos|tan|[A-Za-z]|[^ ]/g).map(t=>{
    if(t.startsWith('√'))return '<msqrt><mn>'+t.slice(1)+'</mn></msqrt>';
    if(/^\d/.test(t))return '<mn>'+t+'</mn>';
    if(/^(sin|cos|tan)$/.test(t))return '<mi mathvariant="normal">'+t+'</mi>';
    if(/^[A-Za-z]$/.test(t))return '<mi>'+t+'</mi>';
    return '<mo>'+t+'</mo>';
  }).join('');
}
const math=content=>'<math xmlns="http://www.w3.org/1998/Math/MathML"><mrow>'+content+'</mrow></math>';
const expr=text=>math(tokens(text));
const frac=(n,d)=>'<mfrac><mrow>'+tokens(n)+'</mrow><mrow>'+tokens(d)+'</mrow></mfrac>';
function geometry(){
  const ref=Math.min(a%180,180-a%180);
  const [w,h,r]=({0:['1','0','1'],30:['√3','1','2'],45:['1','1','√2'],60:['1','√3','2'],90:['0','1','1']})[ref];
  const x=(a>90&&a<270&&w!=='0'?'−':'')+w;
  const y=(a>180&&a<360&&h!=='0'?'−':'')+h;
  return {ref,w,h,r,x,y};
}
function diagram(deg){
  shown=deg;
  const rad=deg*Math.PI/180,c=Math.cos(rad),s=-Math.sin(rad),x=112*c,y=112*s;
  const {x:horizontal,y:vertical,r}=geometry();
  const line=(u,v,i,j,color,width=2)=>'<line x1="'+u+'" y1="'+v+'" x2="'+i+'" y2="'+j+'" stroke="'+color+'" stroke-width="'+width+'"/>';
  const tag=(u,v,t)=>'<foreignObject x="'+(u-40)+'" y="'+(v-19)+'" width="80" height="28"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-label">'+expr(t)+'</div></foreignObject>';
  let svg='<defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#30515a"/></pattern></defs><rect x="-145" y="-135" width="290" height="270" fill="url(#grid)"/><circle r="112" fill="none" stroke="#86a8ab" stroke-width="2"/>';
  svg+=line(-148,0,150,0,'#819d9f')+line(0,-132,0,132,'#819d9f')+tag(159,5,'x')+tag(-9,-136,'y')+tag(-10,18,'O');
  svg+=line(0,0,139,0,'#ffcd78',3)+'<path d="M132 -4L141 0L132 4" fill="#ffcd78"/>';
  if(deg>0){
    const arcR=32, mid=rad/2;
    svg+='<path d="M32 0 A32 32 0 0 0 '+arcR*Math.cos(mid)+' '+(-arcR*Math.sin(mid))+' A32 32 0 0 0 '+arcR*c+' '+arcR*s+'" fill="none" stroke="#ffcd78" stroke-width="3"/>';
  }
  if(step>=2&&a%90){
    svg+='<polygon points="0,0 '+x+',0 '+x+','+y+'" fill="#73e2c5" fill-opacity=".15"/>'+line(0,0,x,0,'#72dfc4',4)+line(x,0,x,y,'#72dfc4',4);
    svg+=tag(x/2,s<0?21:-9,horizontal)+tag(x+Math.sign(c)*19,y/2+4,vertical)+tag(x/2-Math.sign(c)*16,y/2+Math.sign(s)*9,r);
  }
  svg+=line(0,0,x,y,'#ffd079',3)+'<circle cx="'+x+'" cy="'+y+'" r="5" fill="#fff4cf"/>';
  if(step>=2&&a%90===0)svg+=tag(x*.88+(x===0?48:0),y*.94+(y>0?22:-13),'P ('+horizontal+', '+vertical+')');
  $('board').innerHTML=svg;$('reading').textContent=Math.round(deg)+'°';
  $('board').setAttribute('aria-label','右向きの始線から反時計回りに'+Math.round(deg)+'度');
}
function quotient(n,d){
  if(d==='0')return '定義されない';
  if(n==='0')return tokens('0');
  const sign=n.startsWith('−')!==d.startsWith('−')?'−':'';
  const u=n.replace('−',''),v=d.replace('−','');
  return (sign?tokens(sign):'')+(u===v?tokens('1'):v==='1'?tokens(u):frac(u,v));
}
function render(from=0){
  clearTimeout(timer);cancelAnimationFrame(frame);
  const {ref,x,y,r}=geometry(),axis=a%90===0;
  const titles=['右向きが 0°',a+'° まで反時計回りに回す',axis?'終点は軸の上':'基準角は '+ref+'°',axis?'終点の座標から値を読む':'横・縦・斜辺から値を出す'];
  const explanations=['原点 O から右へ伸びる x 軸の正の部分が始線。ここに半径を重ねて出発しよう。',
    a===360?'ちょうど一周。360° の終点は 0° と同じ右端です。':a===0?'回転はゼロ。半径は右を向いたままです。':'始線から '+a+'° 回したところで止めます。半径の先は、円のどこに来るでしょう？',
    axis?'半径を1にすると、'+({0:'出発点は円の右端',90:'4分の1周した終点は真上',180:'半周した終点は左端',270:'4分の3周した終点は真下',360:'一周すると0°と同じ右端'})[a]+'。終点は P = ('+x+', '+y+')。軸の上にあるので、垂線を下ろしても直角三角形はできません。':'終点から x 軸に垂線を下ろそう。半径と x 軸が作る小さい角は '+ref+'°。辺の長さの比は '+(ref===45?'1：1：√2':'1：√3：2')+' です。図では横・縦の向きを符号で示します。左向き・下向きには − が付きます。',
    axis?'単位円の終点を P = (x, y) とすると、cos は x 座標、sin は y 座標。tan は y ÷ x で求めます。':'半径を同じ倍率で伸び縮みさせても、割り算の結果は同じです。'];
  $('title').textContent=titles[step];$('body').innerHTML='<p>'+explanations[step].replace(/1：1：√2|1：√3：2|P = \([^)]*\)|y ÷ x|sin|cos|tan|[xy]/g,t=>expr(t.replaceAll('：',':')))+'</p>';
  if(step===3){
    let rows='';
    for(const [fn,name,n,d] of [['sin','縦 ÷ 斜辺',y,r],['cos','横 ÷ 斜辺',x,r],['tan','縦 ÷ 横',y,x]]){
      const result=quotient(n,d);
      const label=axis?({sin:'y 座標',cos:'x 座標',tan:'y ÷ x'})[fn]:name;
      const left='<td>'+expr(fn+' '+a+'°')+'</td>';
      let cells;
      if(d==='0')cells='<td colspan="4">は定義されない</td>';
      else if(axis&&fn!=='tan')cells='<td>'+expr('=')+'</td><td>'+expr(n)+'</td><td></td><td></td>';
      else{
        const calculation=n+' ÷ '+(d.startsWith('−')?'('+d+')':d);
        cells='<td>'+expr('=')+'</td><td>'+expr(calculation)+'</td><td>'+expr('=')+'</td><td>'+math(result)+'</td>';
      }
      rows+='<tr><th scope="row">'+label+'</th>'+left+cells+'</tr>';
    }
    $('body').insertAdjacentHTML('beforeend','<table class="equations"><tbody>'+rows+'</tbody></table>');
    if(x==='0')$('body').innerHTML+='<p>横の成分が0なので、tan は0で割ることになります。</p>';
  }
  [...document.querySelector('.steps').children].forEach((b,i)=>b.setAttribute('aria-current',i===step?'step':'false'));
  [...document.querySelector('.angles').children].forEach((b,i)=>b.setAttribute('aria-pressed',angles[i]===a));
  document.querySelector('.steps').children[2].textContent=axis?'座標':'辺の比';
  $('back').disabled=step===0;$('next').disabled=step===3;
  playbackLabels();
  if(step===1&&!reduced.matches&&from!==a){
    const start=performance.now(),duration=tour?850:1500*Math.abs(a-from)/Math.max(a,1);
    function rotate(now){
      const t=Math.min(1,(now-start)/duration);
      diagram(from+(a-from)*t*(2-t));
      if(t<1)frame=requestAnimationFrame(rotate);
      else schedule();
    }
    diagram(from);frame=requestAnimationFrame(rotate);
  }else{diagram(step===0?0:a);schedule()}
}
function playbackLabels(){
  $('play').textContent=auto?'Ⅱ 一時停止':tour?'▶ 通し再生を再開':step===3?'↺ もう一度再生':'▶ 自動再生';
  $('tour').textContent=tour?'↺ 0°から通し再生し直す':'▶ 0°から360°まで通し再生';
}
function schedule(){
  if(!auto)return;
  timer=setTimeout(()=>{
    if(tour&&step===3){
      const previous=a;
      a=angles[angles.indexOf(a)+1];step=1;render(previous);return;
    }
    step=tour?3:step+1;
    if(step===3&&(!tour||a===360)){auto=false;tour=false}
    render();
  },step===1?350:tour?3000:2400);
}
function go(i){auto=false;tour=false;step=i;render()}
labels.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>go(i);document.querySelector('.steps').append(b)});
angles.forEach(angle=>{const b=document.createElement('button');b.textContent=angle+'°';b.onclick=()=>{a=angle;go(1)};document.querySelector('.angles').append(b)});
$('play').onclick=()=>{
  if(auto){auto=false;clearTimeout(timer);cancelAnimationFrame(frame);playbackLabels();return}
  auto=true;
  if(step===3&&!tour){step=0;render();return}
  if(step===1&&shown!==a){render(shown);return}
  playbackLabels();schedule();
};
$('tour').onclick=()=>{tour=true;auto=true;a=0;step=3;render()};
$('back').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);render();
</script></html>
