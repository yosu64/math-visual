<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三角関数タイムアタック | Math Visual</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#091923;color:#edf7f6;font:16px/1.65 system-ui,sans-serif}
main,header,footer{width:min(100% - 32px,960px);margin:auto}
header,footer,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header{padding:20px 0;border-bottom:1px solid #33505b;letter-spacing:.08em}
a{color:inherit}header a,footer a{text-decoration:none}
h1{font-size:clamp(26px,5vw,48px);letter-spacing:-.05em;line-height:1.2;margin:28px 0 20px}
h2,p{margin:0 0 14px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
article,figure{margin:0;border:1px solid #39545f;border-radius:20px;padding:clamp(16px,3vw,32px)}
article{background:#f5f4eb;color:#152e36}
figure{background:radial-gradient(ellipse at center,#163b46,#102731);color:#bbd4d9}
figcaption,.status{font:600 13px/1.6 system-ui;letter-spacing:.07em}
svg{display:block;width:min(100%,370px);margin:auto;height:auto}svg text{fill:#edf7f6;font:16px Georgia}
fieldset{border:0;padding:0;margin:22px 0}legend{font-weight:bold;margin-bottom:6px}
label{display:inline-block;margin-right:12px;cursor:pointer}input{accent-color:#116458}
button{font:inherit;font-weight:700;cursor:pointer;color:inherit;border:1px solid #8da69e;border-radius:10px;padding:10px 16px;background:transparent}
button:focus-visible,a:focus-visible{outline:3px solid #d88121;outline-offset:3px}
.primary{width:100%;background:#105f54;border:0;color:white;margin-top:16px}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#choices button{min-height:65px;background:white;font:24px Georgia,serif}
#choices .right{background:#c6ebd6;border:2px solid #177454}
#choices .wrong{background:#fae0d7;border:2px dashed #ae5134}
#formula{font:clamp(34px,5vw,48px) Georgia,serif;text-align:center;margin:20px 0}
.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;font-size:.83em;line-height:1.05}
.frac span:first-child{border-bottom:1px solid;padding:0 .12em .08em}.frac span+span{padding-top:.06em}
progress{width:100%;accent-color:#117968;height:8px}#feedback{margin-top:16px}
footer{padding:22px 0;color:#b4c8cc;font-size:13px}
[hidden]{display:none!important}
@media(max-width:660px){.layout{grid-template-columns:1fr}figure svg{width:min(100%,255px)}h1{margin:18px 0}fieldset{margin:12px 0}}
article{position:relative}
#reward{position:absolute;top:-15px;right:16px;z-index:2;pointer-events:none;border-radius:20px;color:#102c30;background:#ffd571;font-weight:800;box-shadow:0 3px 12px #081e2833}
#reward:not(:empty){padding:3px 14px}

svg .ratio{font:bold 18px Georgia;fill:#ffdd95;paint-order:stroke;stroke:#15323b;stroke-width:4px}
#choices button{position:relative;padding-inline:26px}
#choices kbd{position:absolute;top:5px;left:7px;color:#48605a;font:600 12px/1.5 system-ui}
#clock{font-variant-numeric:tabular-nums}
</style>
<header><a href="../index.html">← Math Visual</a><span>数学Ⅱ ／ 三角関数</span></header>
<main><h1>三角関数タイムアタック</h1>
<div class="layout"><article><output id="reward" aria-live="polite"></output>
<section id="setup"><h2>単位円に挑む10問</h2><p>30°・45°・60°の直角三角形を見つけよう。辺の比で大きさを決めたら、象限で符号をつける。正解すると、すぐ次の問題へ！</p>
<fieldset><legend>角度の表示</legend><label><input type="radio" name="mode" value="deg" checked>度数法</label><label><input type="radio" name="mode" value="rad">弧度法</label><label><input type="radio" name="mode" value="mix">ランダム</label></fieldset>
<label><input type="checkbox" id="hint" checked>解答中も単位円を見る</label><br>
<label><input type="checkbox" id="ratios" checked>図に数値を表示する（横・縦は向きも表示）</label>
<button class="primary" id="start">10問に挑戦 →</button></section>
<section id="play" hidden><div class="row status"><span id="step"></span><span id="clock"></span><span id="points"></span></div><progress id="meter" value="0" max="10"></progress>
<h2 id="formula" tabindex="-1"></h2><p class="status">数字キー・テンキーの 1〜4 でも解答できます。</p><div id="choices"></div><div id="feedback" aria-live="polite"></div><button class="primary" id="next" hidden>次の問題へ →</button></section>
<section id="result" hidden><h2 tabindex="-1" id="summary"></h2><p id="stats"></p><div id="breakdown"></div><button class="primary" id="retry">間違えた問題に再挑戦</button><button class="primary" id="reset">設定に戻る</button></section>
</article><figure id="panel"><figcaption class="row"><strong>単位円と辺の比</strong><span id="angle"></span></figcaption><svg id="circle" viewBox="-150 -150 300 300" role="img"></svg><div id="guide"></div></figure></div></main>
<footer><a href="https://github.com/yosu64/math-visual">© 2026 shibasaki / Math Visual</a></footer>
<script>
const $ = id => document.getElementById(id);
const angles = [0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330,360];
const radians = ['0','π/6','π/4','π/3','π/2','2π/3','3π/4','5π/6','π','7π/6','5π/4','4π/3','3π/2','5π/3','7π/4','11π/6','2π'];
const funcs = ['sin','cos','tan'];
const guides = {sin:'縦の成分 ÷ 斜辺の長さ',cos:'横の成分 ÷ 斜辺の長さ',tan:'縦の成分 ÷ 横の成分'};
function reference(a){return Math.min(a%180,180-a%180)}
function sides(a){
  const ref=reference(a);
  const adj=ref===30?'√3':'1';
  const opp=ref===60?'√3':'1';
  return [(a>90 && a<270?'−':'')+adj,(a>180?'−':'')+opp,ref===45?'√2':'2'];
}
function value(fn,a){
  const half = a%180, ref = Math.min(half,180-half);
  const magnitude = base[fn][[0,30,45,60,90].indexOf(ref)];
  const negative = fn==='sin' ? a>180 : fn==='cos' ? a>90 && a<270 : half>90;
  return negative && magnitude!=='0' && magnitude!=='定義されない' ? '−'+magnitude : magnitude;
}
function math(s){
  if(!s.includes('/')) return s;
  const sign=s.startsWith('−')?'−':'';
  const [n,d]=s.slice(sign.length).split('/');
  return sign+'<span class="frac" aria-label="'+n+' 割る '+d+'"><span>'+n+'</span><span>'+d+'</span></span>';
}
function shuffle(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}
  return copy;
}
function draw(q){
  const {a,fn,label}=q, t=a*Math.PI/180, x=110*Math.cos(t), y=-110*Math.sin(t);
  const line=(x1,y1,x2,y2,style)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" '+style+'/>';
  let grid='';
  for(let i=-110;i<=110;i+=27.5) grid+=line(i,-110,i,110,'')+line(-110,i,110,i,'');
  const ref=reference(a), axis=a%90===0;
  const leg='stroke="#63decc" stroke-width="3"', hyp='stroke="#ffcd77" stroke-width="3"';
  const tag=(x,y,t)=>'<text class="ratio" text-anchor="middle" x="'+x+'" y="'+y+'">'+t+'</text>';
  let triangle=line(0,0,x,y,hyp);
  let tip;
  if(axis){
    const horizontal=a%180===0;
    const direction=horizontal?(x>0?'右':'左'):(y<0?'上':'下');
    tip='半径を1とすると、'+direction+'向きに1。'+(horizontal?'縦':'横')+'の成分は0。';
  }else{
    const [adj,opp,h]=sides(a), sx=Math.sign(x), sy=Math.sign(y);
    triangle='<polygon points="0,0 '+x+',0 '+x+','+y+'" fill="#42c4b3" fill-opacity=".16"/>'+triangle+
      line(0,0,x,0,leg)+line(x,0,x,y,leg)+
      '<path d="M '+(x-sx*8)+' 0 v '+(sy*8)+' h '+(sx*8)+'" stroke="#98c7bd" fill="none"/>'+
      ($('ratios').checked ? tag(x/2,sy<0?19:-8,adj)+tag(x+sx*20,y/2+5,opp)+tag(x/2-sx*14,y/2+sy*8,h) : '');
    tip='基準角 '+ref+'°。'+($('ratios').checked?'辺の長さの比は '+(ref===45?'1：1：√2':'1：√3：2')+'。図の − は、原点から見て左向き・下向きであることを示す。':'')+fn+' は '+guides[fn]+'。';
  }
  $('circle').innerHTML='<g stroke="#31505a" stroke-width=".7">'+grid+'</g><circle r="110" fill="none" stroke="#87acae" stroke-width="2"/><g stroke="#a6c0c5">'+line(-126,0,126,0,'')+line(0,-126,0,126,'')+'</g><text x="132" y="6">x</text><text x="-4" y="-131">y</text>'+triangle+'<circle cx="'+x+'" cy="'+y+'" r="4" fill="#fff4cc"/>';
  $('circle').setAttribute('aria-label',a+'度。'+tip+(axis || !$('ratios').checked?'':' 横の成分 '+sides(a)[0]+'、縦の成分 '+sides(a)[1]+'、斜辺の長さ '+sides(a)[2]));
  $('angle').innerHTML=math(label);
  $('guide').textContent=tip;

}
let deck=[],index=0,score=0,misses=[],started=0,totalMs=0,locked=false;
let streak=0,best=0,clockTimer;
function updateClock(){
  const ms=totalMs+(locked?0:performance.now()-started);
  $('clock').textContent=(ms/1000).toFixed(1)+' 秒';
}
function begin(items){
  streak=0;best=0;$('reward').textContent='';
  clearInterval(clockTimer);clockTimer=setInterval(updateClock,100);
  deck=items;index=0;score=0;misses=[];totalMs=0;
  $('setup').hidden=true;$('result').hidden=true;$('play').hidden=false;show();
}
function show(){
  const q=deck[index], answer=value(q.fn,q.a);
  locked=false;$('next').hidden=true;$('feedback').textContent='';
  $('step').textContent='第 '+(index+1)+' 問 ／ '+deck.length;$('points').textContent=score+' pt';
  $('meter').max=deck.length;$('meter').value=index;
  $('formula').innerHTML=q.fn+' '+math(q.label);$('formula').focus();
  draw(q);$('panel').hidden=!$('hint').checked;
  const opposite=answer.startsWith('−')?answer.slice(1):'−'+answer;
  const pool=shuffle([...new Set(angles.map(a=>value(q.fn,a)))]);
  const choices=[...new Set([answer,...(pool.includes(opposite)?[opposite]:[]),...pool])].slice(0,4);
  $('choices').replaceChildren();
  shuffle(choices).forEach((v,i)=>{
    const button=document.createElement('button');
    const key=String(i+1);
    button.innerHTML='<kbd>'+key+'</kbd>'+math(v);
    button.setAttribute('aria-keyshortcuts',key);
    button.dataset.value=v;
    button.onclick=()=>respond(v);
    $('choices').append(button);
  });
  started=performance.now();
}
function respond(v){
  if(locked)return;locked=true;
  const duration=performance.now()-started;totalMs+=duration;
  const q=deck[index], answer=value(q.fn,q.a), ok=v===answer;
  updateClock();
  if(ok)score+=Math.max(60,120-6*Math.floor(duration/1000));else{score-=100;misses.push(q)}
  for(const b of $('choices').children){b.disabled=true;if(b.dataset.value===answer)b.className='right';else if(b.dataset.value===v)b.className='wrong'}
  $('points').textContent=score+' pt';$('meter').value=index+1;
  if(ok){
    streak++;best=Math.max(best,streak);
    const gain=Math.max(60,120-6*Math.floor(duration/1000));
    $('reward').textContent=(streak===1?'✦ 正解！':'★ '+streak+'連続！')+'　+'+gain;
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
      $('reward').animate([{transform:'scale(.8)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:320});
    }
    setTimeout(advance,220);
    return;
  }
  streak=0;$('reward').textContent='';$('panel').hidden=false;
  let why;
  if(q.a%90===0){
    const x=value('cos',q.a),y=value('sin',q.a);
    why=q.fn==='tan'?(x==='0'?'横の成分が0。0で割れないので定義されない。':'縦の成分が0なので、傾きは0。'):'半径1の終点は ('+x+', '+y+')。'+(q.fn==='sin'?'縦':'横')+'の成分は '+answer+'。';
  }else{
    const [adj,opp,h]=sides(q.a), quotient=q.fn==='sin'?opp+' ÷ '+h:q.fn==='cos'?adj+' ÷ '+h:opp+' ÷ '+(adj.startsWith('−')?'('+adj+')':adj);
    const quadrant=Math.floor(q.a/90)+1;
    why='基準角 '+reference(q.a)+'°。'+q.fn+' は '+guides[q.fn]+' = '+quotient+'。第'+quadrant+'象限では '+q.fn+' は'+(answer.startsWith('−')?'負':'正')+'。';
  }
  $('feedback').innerHTML='<strong>正解は '+math(answer)+'</strong><br>'+why;
  $('next').textContent=index+1===deck.length?'結果を見る →':'次の問題へ →';$('next').hidden=false;$('next').focus();
}
$('start').onclick=()=>{
  const mode=document.querySelector('[name=mode]:checked').value;
  const order=[...shuffle(funcs),...shuffle(funcs),...shuffle(funcs),shuffle(funcs)[0]];
  begin(shuffle(angles).slice(0,10).map((a,i)=>({a,fn:order[i],label:mode==='deg'||mode==='mix'&&Math.random()<.5?a+'°':radians[angles.indexOf(a)]})));
};
function advance(){
  if(++index<deck.length){show();return}
  clearInterval(clockTimer);
  $('play').hidden=true;$('result').hidden=false;$('panel').hidden=true;
  $('summary').textContent=(deck.length-misses.length)+' / '+deck.length+' 問正解';
  $('stats').textContent=score+' pt　解答時間 '+(totalMs/1000).toFixed(1)+' 秒　最高 '+best+' 連続正解';
  $('breakdown').textContent=funcs.filter(f=>deck.some(q=>q.fn===f)).map(f=>{const count=deck.filter(q=>q.fn===f).length;return f+' '+(count-misses.filter(q=>q.fn===f).length)+'/'+count}).join('　');
  $('retry').hidden=!misses.length;$('summary').focus();
};
$('next').onclick=advance;
$('retry').onclick=()=>begin(shuffle(misses));
function setup(){ $('reward').textContent='';$('result').hidden=true;$('setup').hidden=false;$('panel').hidden=false;draw({a:60,fn:'sin',label:'60°'}) }
$('ratios').onchange=()=>draw({a:60,fn:'sin',label:'60°'});
document.addEventListener('keydown',event=>{
  if($('play').hidden || locked || event.repeat || event.isComposing ||
     event.ctrlKey || event.metaKey || event.altKey || event.shiftKey)return;
  if(!/^[1-4]$/.test(event.key))return;
  event.preventDefault();
  $('choices').children[Number(event.key)-1].click();
});
$('reset').onclick=()=>{setup();$('start').focus()};setup();
</script>
</html>
